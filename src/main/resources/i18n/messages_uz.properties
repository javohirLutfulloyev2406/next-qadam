onboarding.welcome.name=👋 Assalomu alaykum! Men NextQadam — katta orzularingni kichik, bajarilishi oson qadamlarga bo'lib beruvchi shaxsiy hamrohingman.\n\nKatta reja emas — bugungi bitta qadam. Shu tarzda oldinga siljiymiz. 🚀\n\nAvval tanishib olaylik — ismingiz nima?
onboarding.ask.language=🌍 Qaysi tilda gaplashamiz?\nНа каком языке будем общаться?\nWhich language should we use?
onboarding.welcome.back=Yana xush kelibsiz, {0}! 👋
onboarding.ask.tone=Tanishganimdan xursandman, {0}! Endi menga qaysi uslubda gaplashishimni tanlang:\n\n🌱 Yumshoq — iliq va tushunuvchan ohangda qo''llab-quvvatlayman\n📋 Oddiy — sodda va aniq, ortiqcha so''zlarsiz gaplashaman\n🔥 Qattiq — tik va talabchan, gapni aylantirmayman\n⚡ Hardcore — hech narsani yumshatmayman, to''g''ridan-to''g''ri aytaman
onboarding.guide.prompt=📖 Aytgancha, botdan to'liq foydalanish uchun qisqa qo'llanma tayyorladik — xohlasangiz ko'rib chiqing:
onboarding.restart=✅ Tayyor — hammasi tozalandi. Qaytadan tanishaylik. Ismingiz nima?