reset.intro=🔄 <b>Hisobingizni tozalash</b>\n\nIkki variant bor:\n\n<b>Yangidan boshlash</b> — barcha maqsad, vazifa va xotirangiz yashiriladi, bot sizni yangi foydalanuvchidek qayta tanishtiradi. Ma'lumot texnik jihatdan bazada qoladi (masalan xizmat sifatini yaxshilash uchun), lekin sizga va botning hech bir funksiyasiga ko'rinmaydi.\n\n<b>Butunlay o'chirish</b> — barcha ma'lumotingiz bazadan HAQIQIY o'chiriladi, qaytarib bo'lmaydi.\n\nQaysi birini tanlaysiz?
reset.soft.confirm=🔄 Rostdan ham boshidan boshlaymizmi? Joriy maqsad va vazifalaringiz yashiriladi.
reset.hard.confirm=🗑 <b>Diqqat:</b> bu amal QAYTARILMAYDI. Barcha ma'lumotingiz butunlay o'chadi. Rostdan ham davom etamizmi?
reset.hard.done=✅ Barcha ma'lumotingiz o'chirildi. Yangi suhbat boshlash uchun istalgan vaqtda /start yozishingiz mumkin.
reset.cancelled=Bekor qilindi, hech narsa o'zgarmadi.

