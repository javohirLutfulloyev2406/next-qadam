reset.intro=🔄 <b>Reset your account</b>\n\nThere are two options:\n\n<b>Start over</b> — all your goals, tasks and memory will be hidden, and the bot will introduce itself to you again as if you were new. The data technically stays in the database (e.g. for service-quality purposes), but won't be visible to you or to any bot feature.\n\n<b>Delete completely</b> — all your data will be PERMANENTLY removed from the database, with no way to recover it.\n\nWhich one would you like?
reset.soft.confirm=🔄 Are you sure you want to start over? Your current goals and tasks will be hidden.
reset.hard.confirm=🗑 <b>Warning:</b> this action CANNOT be undone. All your data will be permanently deleted. Are you sure you want to continue?
reset.hard.done=✅ All your data has been deleted. Whenever you're ready to start a new conversation, just send /start.
reset.cancelled=Cancelled, nothing has changed.

