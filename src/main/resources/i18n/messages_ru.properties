reset.intro=🔄 <b>Очистка аккаунта</b>\n\nЕсть два варианта:\n\n<b>Начать заново</b> — все цели, задачи и память будут скрыты, бот снова представится вам как новому пользователю. Данные технически останутся в базе (например, для улучшения качества сервиса), но не будут видны ни вам, ни какой-либо функции бота.\n\n<b>Удалить полностью</b> — все ваши данные будут НАВСЕГДА удалены из базы, восстановить их будет невозможно.\n\nКакой вариант выбираете?
reset.soft.confirm=🔄 Точно хотите начать заново? Текущие цели и задачи будут скрыты.
reset.hard.confirm=🗑 <b>Внимание:</b> это действие НЕЛЬЗЯ отменить. Все ваши данные будут полностью удалены. Точно продолжаем?
reset.hard.done=✅ Все ваши данные удалены. Чтобы начать новый разговор, в любой момент напишите /start.
reset.cancelled=Отменено, ничего не изменилось.

