onboarding.welcome.name=👋 Hello! I'm NextQadam — your personal companion that breaks big dreams into small, doable steps.\n\nNot a big plan — just today's one step. That's how we move forward. 🚀\n\nLet's get to know each other first — what's your name?
onboarding.ask.language=🌍 Qaysi tilda gaplashamiz?\nНа каком языке будем общаться?\nWhich language should we use?
onboarding.welcome.back=Welcome back, {0}! 👋
onboarding.ask.tone=Nice to meet you, {0}! Now choose the style you''d like me to use:\n\n🌱 Soft — warm and understanding support\n📋 Normal — simple and to the point, no fluff\n🔥 Hard — direct and demanding, no sugarcoating\n⚡ Hardcore — nothing softened, straight talk only
onboarding.guide.prompt=📖 By the way, we've prepared a short guide on using the bot — feel free to check it out:
onboarding.restart=✅ Done — everything's cleared. Let's get acquainted again. What's your name?