task.done.HARD="{0}" — tayyor. Keyingisiga o''tamiz, to''xtamang.
task.done.HARDCORE="{0}" bajarildi. Kayfiyatni kutma — navbatdagisi kutib turmaydi.

task.none.SOFT=Hozircha bajarilishi kerak bo'lgan vazifa yo'q ekan 🙂 Xohlasangiz, /newgoal orqali yangi maqsad qo'shishingiz mumkin — shoshilmang, o'z vaqtida boshlaymiz.
