onboarding.welcome.name=👋 Здравствуйте! Я — NextQadam, ваш личный помощник, который разбивает большие мечты на маленькие, легко выполнимые шаги.\n\nНе большой план, а один шаг сегодня. Так мы двигаемся вперёд. 🚀\n\nДавайте познакомимся — как вас зовут?
onboarding.ask.language=🌍 Qaysi tilda gaplashamiz?\nНа каком языке будем общаться?\nWhich language should we use?
onboarding.welcome.back=С возвращением, {0}! 👋
onboarding.ask.tone=Приятно познакомиться, {0}! Теперь выберите, в каком стиле мне с вами общаться:\n\n🌱 Мягкий — буду поддерживать тепло и с пониманием\n📋 Обычный — просто и по делу, без лишних слов\n🔥 Жёсткий — прямо и требовательно, без сантиментов\n⚡ Хардкор — ничего не смягчаю, говорю как есть
onboarding.guide.prompt=📖 Кстати, мы подготовили краткое руководство по использованию бота — если хотите, ознакомьтесь:
onboarding.restart=✅ Готово — всё очищено. Давайте познакомимся заново. Как вас зовут?