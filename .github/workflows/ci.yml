name: CI Build

on:
  push:
    branches: [ dev-master, dev-Javohir ]
  pull_request:
    branches: [ main, dev-master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify
