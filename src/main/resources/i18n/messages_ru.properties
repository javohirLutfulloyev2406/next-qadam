onboarding.welcome_after_tone.SOFT=Спасибо, {0}! 🌱 Теперь я уверен, что мы познакомились — будем двигаться вместе, не спеша, в вашем темпе. Когда будете готовы поставить первую цель, используйте кнопку ниже. 💛
