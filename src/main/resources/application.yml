spring:
  application:
    name: nextQadam
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}
    admin-group-id: ${TELEGRAM_ADMIN_GROUP_ID:0}

ai:
  client:
    api-key: ${LLM_API_KEY}
    model: ${AI_MODEL:gemini-3.6-flash}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}

logging:
  level:
    uz.nextqadam: INFO