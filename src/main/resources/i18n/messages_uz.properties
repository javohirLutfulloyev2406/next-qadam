onboarding.welcome_after_tone.SOFT=Rahmat, {0}! 🌱 Endi tanishganimizga ishonaman — birga, shoshilmasdan, o''z sur''atingizda harakatlanamiz. Birinchi maqsadingizni qo''yishga tayyor bo''lsangiz, quyidagi tugmadan foydalaning. 💛
